<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>个人主页 · 极简卡片</title>
  <!-- Font Awesome 图标库 (免费) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 30%, #1a1f2e, #0b0d14);
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* 动态粒子背景 (纯CSS小点) */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      animation: float 16s infinite alternate ease-in-out;
      box-shadow: 0 0 12px rgba(120, 180, 255, 0.2);
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      100% { transform: translate(60px, -120px) scale(1.4); opacity: 0.8; }
    }

    /* 卡片主体 — 毛玻璃效果 */
    .card {
      position: relative;
      z-index: 2;
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 3.5rem;
      padding: 2.8rem 2.5rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: transform 0.3s ease, box-shadow 0.4s ease;
      color: #f0f4fe;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    /* 头像区域 */
    .avatar-wrapper {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(145deg, #7c9cff, #4b6fd4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 500;
      color: white;
      box-shadow: 0 8px 24px rgba(60, 100, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      transition: 0.3s;
    }

    .avatar:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 32px rgba(60, 100, 255, 0.5);
    }

    .name-title h1 {
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #c8d9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
    }

    .name-title .badge {
      display: inline-block;
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      color: #b7cbff;
      border: 1px solid rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
    }

    /* 简介 */
    .bio {
      margin: 1.8rem 0 2rem 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #d3defa;
      background: rgba(0, 0, 0, 0.15);
      padding: 1.2rem 1.6rem;
      border-radius: 2rem;
      border-left: 4px solid #5f85ff;
      backdrop-filter: blur(4px);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .bio i {
      color: #8aacff;
      margin-right: 8px;
    }

    /* 社交链接 - 网格 */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.9rem;
      margin: 2.2rem 0 1.8rem;
    }

    .social-item {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
      padding: 0.9rem 0.8rem;
      border-radius: 2.2rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #dfe8ff;
      text-decoration: none;
      font-weight: 450;
      font-size: 0.95rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      cursor: default;
      /* 默认不可点击，但保留样式 */ 
    }

    .social-item i {
      font-size: 1.2rem;
      width: 1.6rem;
      color: #8aacff;
      transition: 0.2s;
    }

    .social-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(120, 170, 255, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 10, 30, 0.4);
      color: white;
    }

    .social-item:hover i {
      color: #b7cbff;
    }

    /* 联系按钮 (真实链接) */
    .contact-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.7rem 1.6rem;
      border-radius: 3rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: #e0eaff;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .btn i {
      font-size: 1rem;
      color: #8aacff;
    }

    .btn-primary {
      background: linear-gradient(145deg, #3b6aff, #1f4ad6);
      border: none;
      color: white;
      box-shadow: 0 8px 18px rgba(40, 80, 255, 0.3);
      font-weight: 500;
    }

    .btn-primary i {
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(145deg, #4f7aff, #2a55e6);
      transform: scale(1.02);
      box-shadow: 0 12px 28px rgba(40, 80, 255, 0.5);
      border-color: transparent;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.8rem;
      color: rgba(200, 215, 255, 0.35);
      letter-spacing: 0.5px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      padding-top: 1.2rem;
    }

    /* 响应式优化 */
    @media (max-width: 560px) {
      .card {
        padding: 2rem 1.5rem;
        border-radius: 2.5rem;
      }
      .avatar-wrapper {
        flex-direction: column;
        align-items: flex-start;
      }
      .name-title h1 {
        font-size: 1.8rem;
      }
      .bio {
        font-size: 0.95rem;
        padding: 1rem 1.2rem;
      }
      .social-grid {
        grid-template-columns: 1fr 1fr;
      }
      .contact-links {
        flex-direction: column;
        align-items: stretch;
      }
      .btn {
        justify-content: center;
      }
    }

    @media (max-width: 400px) {
      .social-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 小点缀 — 装饰光晕 */
    .glow {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(70, 130, 255, 0.08), transparent 70%);
      border-radius: 50%;
      top: -60px;
      right: -40px;
      pointer-events: none;
      z-index: 0;
    }

    .glow-bottom {
      bottom: -80px;
      left: -60px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(180, 120, 255, 0.06), transparent 70%);
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 粒子背景 -->
  <div class="particles" id="particles-container"></div>

  <!-- 卡片 -->
  <div class="card">
    <!-- 装饰光晕 (纯视觉) -->
    <div class="glow"></div>
    <div class="glow-bottom"></div>

    <!-- 头像 + 名称 -->
    <div class="avatar-wrapper">
      <div class="avatar">
        <i class="fas fa-user-astronaut"></i>
      </div>
      <div class="name-title">
        <h1>林 一</h1>
        <span class="badge"><i class="fas fa-code" style="margin-right: 6px;"></i>全栈 · 创意开发者</span>
      </div>
    </div>

    <!-- 个人简介 -->
    <div class="bio">
      <i class="fas fa-quote-left" style="opacity: 0.6;"></i> 
      用代码构建优雅的数字体验。热爱开源、设计系统和交互艺术。
      <span style="display: inline-block; margin-left: 6px;">🚀</span>
    </div>

    <!-- 社交链接 (占位，可替换) -->
    <div class="social-grid">
      <span class="social-item"><i class="fab fa-github"></i> github</span>
      <span class="social-item"><i class="fab fa-twitter"></i> twitter</span>
      <span class="social-item"><i class="fab fa-linkedin-in"></i> linkedin</span>
      <span class="social-item"><i class="fab fa-dev"></i> dev.to</span>
    </div>

    <!-- 联系行动区 (真实可点击) -->
    <div class="contact-links">
      <a href="#" class="btn btn-primary"><i class="fas fa-envelope"></i> 联系我</a>
      <a href="#" class="btn btn-outline"><i class="fas fa-paper-plane"></i> 作品集</a>
      <a href="#" class="btn btn-outline"><i class="fas fa-file-alt"></i> 简历</a>
    </div>

    <div class="footer-note">
      <i class="far fa-copyright" style="margin-right: 4px;"></i> 2026 · 基于网页卡片
    </div>
  </div>

  <script>
    // 生成动态粒子 (纯CSS点缀增强)
    (function createParticles() {
      const container = document.getElementById('particles-container');
      const count = 40; // 粒子数量
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 18 + 6; // 6~24px
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const duration = 14 + Math.random() * 22; // 14~36s
        const delay = Math.random() * 20;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = x + '%';
        particle.style.top = y + '%';
        particle.style.animationDuration = duration + 's';
        particle.style.animationDelay = delay + 's';
        particle.style.opacity = 0.15 + Math.random() * 0.25;
        container.appendChild(particle);
      }
    })();
  </script>
</body>
</html>
